inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude
    - Include

inherit_gem:
  rubocop-gusto:
    - config/default.yml

# The behavior of RuboCop can be controlled via the .rubocop.yml
# configuration file. It makes it possible to enable/disable
# certain cops (checks) and to alter their behavior if they accept
# any parameters. The file can be placed either in your home
# directory or in some project directory.
#
# RuboCop will start looking for the configuration file in the directory
# where the inspected file is and continue its way up to the root directory.
#
# See https://docs.rubocop.org/rubocop/configuration
AllCops:
  NewCops: enable
  Exclude:
    - vendor/bundle/**/**

plugins:
  - rubocop-gusto

Gemspec/RequireMFA:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

# This rubocop is annoying when we use interfaces a lot
Lint/UnusedMethodArgument:
  Enabled: false

# rubocop-gusto disables this, but no block outside specs and gemspecs (both excluded) exceeds the limit.
Metrics/BlockLength:
  Enabled: true

Metrics/ParameterLists:
  Enabled: true
  CountKeywordArgs: false

Naming/FileName:
  Enabled: false

# Types are written as RBS comments, which Sorbet checks statically, so the gem
# does not depend on sorbet-runtime. A dependency may still load sorbet-runtime,
# so specs would not notice runtime `T` APIs creeping back in; these cops do.
Sorbet/ForbidSig:
  Enabled: true

Sorbet/ForbidSigWithoutRuntime:
  Enabled: true

Sorbet/ForbidTAbsurd:
  Enabled: true
  AutocorrectToRBS: true

Sorbet/ForbidTBind:
  Enabled: true
  AutocorrectToRBS: true

Sorbet/ForbidTCast:
  Enabled: true
  AutocorrectToRBS: true

Sorbet/ForbidTEnum:
  Enabled: true

Sorbet/ForbidTHelpers:
  Enabled: true

Sorbet/ForbidTLet:
  Enabled: true
  AutocorrectToRBS: true

Sorbet/ForbidTMust:
  Enabled: true
  AutocorrectToRBS: true

Sorbet/ForbidTSig:
  Enabled: true

Sorbet/ForbidTStruct:
  Enabled: true
  AutocorrectStyle: rbs

Sorbet/ForbidTTypeAlias:
  Enabled: true

Sorbet/ForbidTUnsafe:
  Enabled: true
  AutocorrectToRBS: true

Sorbet/StrictSigil:
  Enabled: true
  Exclude:
    - tasks/cop_documentation.rake
    - spec/**/*

# Blocks across lines are okay sometimes
Style/BlockDelimiters:
  Enabled: false

# This leads to code that is not very readable at times (very long lines)
Style/ConditionalAssignment:
  Enabled: false

# Sometimes we want to more explicitly list out a condition
Style/RedundantCondition:
  Enabled: false

# This cop is annoying with typed configuration
Style/TrivialAccessors:
  Enabled: false
